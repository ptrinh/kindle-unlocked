<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kindle Remote</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kindle">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/64.png">
<link rel="apple-touch-icon" href="/icons/180.png">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="pair" class="pair" hidden>
  <div class="pair-card">
    <img src="/icons/180.png" alt="" class="pair-icon">
    <h1>Kindle Remote</h1>
    <p>Enter the PIN shown on your Kindle.</p>
    <input id="pin" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="••••••">
    <p class="err" id="pin-err"></p>
  </div>
</div>

<div id="away" class="pair" hidden>
  <div class="pair-card">
    <img src="/icons/180.png" alt="" class="pair-icon">
    <h1>Kindle is offline</h1>
    <p>Make sure it's awake and on Wi-Fi. Trying again…</p>
  </div>
</div>

<div id="main" hidden>
  <header class="bar">
    <div class="screen-thumb" id="thumb" title="Tap to refresh"><img id="shot" alt=""></div>
    <div class="bar-info">
      <b>Kindle</b>
      <span id="stat">…</span>
    </div>
    <button class="round" id="refresh" aria-label="Refresh">
      <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4"/></svg>
    </button>
  </header>

  <main id="view"></main>

  <nav class="tabs" id="tabs">
    <button data-tab="display" class="on"><svg viewBox="0 0 24 24"><rect x="5" y="2.5" width="14" height="19" rx="2.5"/><path d="M9 18h6"/></svg>Display</button>
    <button data-tab="frame"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="m3 16 5-5 4 4 3-3 6 6"/><circle cx="16" cy="9" r="1.5"/></svg>Frame</button>
    <button data-tab="files"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>Files</button>
    <button data-tab="device"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>Device</button>
  </nav>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-bg" data-close></div>
  <div class="sheet-card" id="sheet-card"></div>
</div>
<div class="toast" id="toast"></div>

<script src="/app.js"></script>
</body>
</html>
